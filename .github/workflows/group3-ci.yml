name: Group 3 CI

on:
  push:
    paths:
      - 'group3/**'
      - '.github/workflows/group3-ci.yml'
  pull_request:
    paths:
      - 'group3/**'
      - '.github/workflows/group3-ci.yml'

permissions:
  contents: read

concurrency:
  group: group3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: group3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: group3/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run backend tests
        run: PYTHONPATH=. pytest -q

  frontend-unit-and-build:
    name: Frontend unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: group3/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: group3/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test -- --run

      - name: Build Next.js frontend
        run: npm run build

  frontend-e2e:
    name: Frontend Playwright tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: group3/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: group3/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: group3-playwright-report
          path: |
            group3/frontend/playwright-report
            group3/frontend/test-results
          if-no-files-found: ignore
